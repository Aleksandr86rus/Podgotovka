<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>📖 Книга — Подготовка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #12121f;
            color: #eeeeee;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: linear-gradient(135deg, #1a1c2e, #0f2b48);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
            color: #ff4757;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls button {
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        .controls button:active { transform: scale(0.96); }
        .controls button:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

        .page-info {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-input {
            width: 45px;
            padding: 4px;
            border-radius: 6px;
            border: 1.5px solid #ff4757;
            background: #1a1c2e;
            color: #fff;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }

        /* ===== ПАНЕЛЬ ИНСТРУМЕНТОВ ===== */
        .toolbar {
            background: #161828;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid #22253a;
        }

        .toolbar button {
            background: #22253a;
            color: #e1e1e1;
            border: 1px solid #323652;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .toolbar button:hover { background: #323652; }
        .toolbar button.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
        }

        .zoom-info {
            color: #ff4757;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
            font-size: 0.85rem;
        }

        /* ===== МАКЕТ ===== */
        .app-layout {
            display: flex;
            height: calc(100vh - 105px);
        }

        .sidebar {
            width: 150px;
            background: #161828;
            overflow-y: auto;
            padding: 10px;
            display: none;
            flex-shrink: 0;
            border-right: 1px solid #22253a;
        }

        .sidebar.open { display: block; }

        .thumb-item {
            cursor: pointer;
            margin-bottom: 10px;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            background: #0f101c;
            transition: border-color 0.2s;
        }

        .thumb-item.active {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        .thumb-item img { width: 100%; display: block; }

        .thumb-num {
            position: absolute;
            bottom: 3px;
            right: 4px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.65rem;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .main-content {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* ===== РЕЖИМЫ ПРОСМОТРА ===== */
        .single-view { display: flex; justify-content: center; width: 100%; }
        .single-view img {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 4px;
            transition: transform 0.2s ease-out;
        }

        .book-view { display: flex; justify-content: center; width: 100%; }
        .book-spread { display: flex; position: relative; max-width: 100%; }
        .book-spread::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0.1), rgba(0,0,0,0.4));
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .page-left img, .page-right img {
            display: block;
            max-height: 80vh;
            max-width: 100%;
            object-fit: contain;
        }

        .page-left img { border-radius: 6px 0 0 6px; box-shadow: -5px 5px 20px rgba(0,0,0,0.5); }
        .page-right img { border-radius: 0 6px 6px 0; box-shadow: 5px 5px 20px rgba(0,0,0,0.5); }

        .page-placeholder {
            background: #1c1e33;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.2rem;
            width: 260px;
            height: 380px;
        }

        .scroll-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 40px;
            width: 100%;
        }

        .scroll-view img {
            max-width: 100%;
            height: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* ===== ЭКРАН ЗАГРУЗКИ ===== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #12121f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #22253a;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 1rem;
            color: #ff4757;
            text-align: center;
        }

        /* ===== ОШИБКА ===== */
        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 20px;
            text-align: center;
        }

        .error-screen h2 { color: #ff4757; margin-bottom: 10px; }
        .error-screen p { color: #aaa; margin-bottom: 15px; max-width: 500px; line-height: 1.5; font-size: 0.95rem; }
        .error-screen button {
            background: #ff4757; color: #fff; border: none;
            padding: 10px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer;
        }

        /* ===== НОЧНОЙ РЕЖИМ ===== */
        body.night .main-content { background: #080811; }
        body.night img { filter: brightness(0.75) contrast(1.1); }

        /* ===== УВЕДОМЛЕНИЕ ===== */
        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4757;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 200;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .fs-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(255, 71, 87, 0.85);
            color: #fff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 50;
            display: none;
        }

        @media(max-width: 768px) {
            .header { padding: 10px; }
            .header h1 { font-size: 1rem; }
            .controls button { padding: 6px 12px; font-size: 0.8rem; }
            .toolbar { padding: 6px 10px; gap: 4px; }
            .main-content { padding: 10px; }
            .sidebar { width: 110px; }
        }

        @media(max-width: 480px) {
            .book-spread { flex-direction: column; gap: 8px; }
            .book-spread::before { display: none; }
            .page-left img, .page-right img { border-radius: 4px; max-height: 70vh; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loading-text" id="loadText">Загрузка книги...</div>
    </div>

    <!-- ЭКРАН ОШИБКИ -->
    <div id="errScreen" class="error-screen" style="display:none">
        <h2>❌ Страницы не найдены</h2>
        <p id="errMsg">Не удалось найти изображения в папке <code>images/</code>.</p>
        <button onclick="location.reload()">🔄 Попробовать снова</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="reader" style="display:none">
        <div class="header">
            <h1>📖 <span id="title">Подготовка</span></h1>
            <div class="controls">
                <button id="btnPrev">◀ Назад</button>
                <div class="page-info">
                    <input type="number" class="page-input" id="pgInput" min="1" value="1">
                    / <span id="pgTotal">0</span>
                </div>
                <button id="btnNext">Далее ▶</button>
            </div>
        </div>

        <div class="toolbar">
            <button id="btnZoomOut">🔍−</button>
            <span class="zoom-info" id="zoomVal">100%</span>
            <button id="btnZoomIn">🔍+</button>
            <button id="btnFit">📐 Вписать</button>
            <button id="btnThumbs">🗂 Страницы</button>
            <button id="btnNight">🌙</button>
            <button class="active" data-view="single" title="Одна страница">📄</button>
            <button data-view="book" title="Разворот">📖</button>
            <button data-view="scroll" title="Прокрутка">📜</button>
        </div>

        <div class="app-layout">
            <div class="sidebar" id="sidebar"></div>
            <div class="main-content" id="main"></div>
        </div>
    </div>

    <button class="fs-btn" id="fsBtn">⛶</button>
    <div class="toast" id="toast"></div>

    <script>
        const CONFIG = {
            jsonPath: 'pages.json',
            folder: 'images',
            ext: 'jpg',
            maxPages: 300
        };

        let pages = [];
        let cur = 1;
        let total = 0;
        let zoom = 1;
        let mode = 'single';
        let thumbsDone = false;

        const $ = id => document.getElementById(id);
        const loader = $('loader');
        const loadText = $('loadText');
        const errScreen = $('errScreen');
        const reader = $('reader');
        const main = $('main');
        const sidebar = $('sidebar');
        const pgInput = $('pgInput');
        const pgTotal = $('pgTotal');
        const zoomVal = $('zoomVal');
        const toast = $('toast');
        const viewBtns = document.querySelectorAll('[data-view]');

        // Проверка файла через Image
        function testImage(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Попытка 1: Погрузка списка из pages.json
        async function loadFromJSON() {
            try {
                const res = await fetch(CONFIG.jsonPath + '?v=' + Date.now());
                if (!res.ok) return false;
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    pages = data;
                    return true;
                }
            } catch (e) { }
            return false;
        }

        // Попытка 2: Перебор картинок 1.jpg, 2.jpg...
        async function autoScanPages() {
            pages = [];
            let fails = 0;
            for (let i = 1; i <= CONFIG.maxPages; i++) {
                const url = `${CONFIG.folder}/${i}.${CONFIG.ext}`;
                const ok = await testImage(url);
                if (ok) {
                    pages.push(url);
                    fails = 0;
                    loadText.textContent = `Найдено страниц: ${pages.length}`;
                } else {
                    fails++;
                    if (fails >= 3 && pages.length > 0) break;
                    if (fails >= 5 && pages.length === 0) break;
                }
            }
            return pages.length > 0;
        }

        async function init() {
            loadText.textContent = 'Загрузка книги...';

            let loaded = await loadFromJSON();
            if (!loaded) {
                loaded = await autoScanPages();
            }

            if (!loaded) {
                loader.classList.add('hidden');
                errScreen.style.display = 'flex';
                return;
            }

            total = pages.length;
            pgTotal.textContent = total;
            pgInput.max = total;

            loader.classList.add('hidden');
            reader.style.display = 'block';
            $('fsBtn').style.display = 'block';
            render();
        }

        function render() {
            main.innerHTML = '';
            if (mode === 'single') renderSingle();
            else if (mode === 'book') renderBook();
            else renderScroll();
            updateUI();
        }

        function makeImg(idx) {
            const img = document.createElement('img');
            img.src = pages[idx];
            img.alt = 'Стр. ' + (idx + 1);
            return img;
        }

        function renderSingle() {
            const wrap = document.createElement('div');
            wrap.className = 'single-view';
            const img = makeImg(cur - 1);
            img.style.transform = `scale(${zoom})`;
            img.style.transformOrigin = 'top center';
            wrap.appendChild(img);
            main.appendChild(wrap);
        }

        function renderBook() {
            const wrap = document.createElement('div');
            wrap.className = 'book-view';
            const spread = document.createElement('div');
            spread.className = 'book-spread';

            let L, R;
            if (cur === 1) { L = null; R = 1; }
            else {
                L = cur % 2 === 0 ? cur : cur - 1;
                R = L + 1;
                cur = L;
            }

            const ld = document.createElement('div');
            ld.className = 'page-left';
            if (L && L <= total) ld.appendChild(makeImg(L - 1));
            else {
                const p = document.createElement('div');
                p.className = 'page-placeholder'; p.textContent = '📖';
                ld.appendChild(p);
            }
            spread.appendChild(ld);

            const rd = document.createElement('div');
            rd.className = 'page-right';
            if (R && R <= total) rd.appendChild(makeImg(R - 1));
            else {
                const p = document.createElement('div');
                p.className = 'page-placeholder'; p.textContent = '— конец —';
                rd.appendChild(p);
            }
            spread.appendChild(rd);

            wrap.appendChild(spread);
            main.appendChild(wrap);
        }

        function renderScroll() {
            const wrap = document.createElement('div');
            wrap.className = 'scroll-view';
            pages.forEach((_, i) => {
                const img = makeImg(i);
                img.loading = 'lazy';
                wrap.appendChild(img);
            });
            main.appendChild(wrap);
        }

        function buildThumbs() {
            if (thumbsDone) return;
            thumbsDone = true;
            sidebar.innerHTML = '';
            pages.forEach((_, i) => {
                const n = i + 1;
                const d = document.createElement('div');
                d.className = 'thumb-item' + (n === cur ? ' active' : '');
                d.dataset.p = n;
                const img = makeImg(i);
                img.loading = 'lazy';
                d.appendChild(img);
                const lbl = document.createElement('div');
                lbl.className = 'thumb-num'; lbl.textContent = n;
                d.appendChild(lbl);
                d.onclick = () => { cur = n; render(); scrollTop(); };
                sidebar.appendChild(d);
            });
        }

        function updateUI() {
            pgInput.value = cur;
            if (mode === 'book') {
                $('btnPrev').disabled = cur <= 1;
                $('btnNext').disabled = cur >= total - 1;
            } else {
                $('btnPrev').disabled = cur <= 1;
                $('btnNext').disabled = cur >= total;
            }
            zoomVal.textContent = Math.round(zoom * 100) + '%';
            document.querySelectorAll('.thumb-item').forEach(t =>
                t.classList.toggle('active', +t.dataset.p === cur));
        }

        function scrollTop() { main.scrollTo({ top: 0, behavior: 'smooth' }); }

        $('btnPrev').onclick = () => {
            cur = mode === 'book' ? Math.max(1, cur - 2) : Math.max(1, cur - 1);
            render(); scrollTop();
        };

        $('btnNext').onclick = () => {
            cur = mode === 'book' ? Math.min(total, cur + 2) : Math.min(total, cur + 1);
            render(); scrollTop();
        };

        pgInput.onchange = () => {
            let v = parseInt(pgInput.value);
            if (isNaN(v) || v < 1) v = 1;
            if (v > total) v = total;
            cur = v; render(); scrollTop();
        };

        $('btnZoomIn').onclick = () => { zoom = Math.min(zoom + 0.2, 3); render(); };
        $('btnZoomOut').onclick = () => { zoom = Math.max(zoom - 0.2, 0.5); render(); };
        $('btnFit').onclick = () => { zoom = 1; render(); notify('📐 100%'); };

        $('btnThumbs').onclick = () => {
            sidebar.classList.toggle('open');
            if (sidebar.classList.contains('open')) buildThumbs();
        };

        $('btnNight').onclick = () => {
            document.body.classList.toggle('night');
            const n = document.body.classList.contains('night');
