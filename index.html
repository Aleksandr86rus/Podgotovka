<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📖 Книга</title>
    
    <!-- Подключение библиотеки реалистичного 3D-перелистывания -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/build/js/page-flip.browser.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #111118;
            background: radial-gradient(circle at center, #1b1c2e 0%, #0a0a10 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* ----- ШАПКА ----- */
        .top-bar {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
        }

        .counter {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        /* ----- КОНТЕЙНЕР КНИГИ ----- */
        .book-container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        .page-flip-book {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: none;
        }

        .page-block {
            background-color: #12121a;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-block img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* ----- НИЖНЯЯ НАВИГАЦИЯ ----- */
        .bottom-bar {
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            transform: none;
        }

        /* ----- ЗАГРУЗЧИК ----- */
        .loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff4757;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .error-msg {
            display: none;
            color: #ff4757;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Открываем книгу...</div>
        <div class="error-msg" id="errorMsg">Не удалось найти изображения</div>
    </div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="title">📖 Подготовка</div>
        <div class="counter" id="counter">1 / 1</div>
    </div>

    <!-- Контейнер книги -->
    <div class="book-container">
        <div id="book" class="page-flip-book"></div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-bar">
        <button class="nav-btn" id="prevBtn" title="Назад">◀</button>
        <button class="nav-btn" id="nextBtn" title="Вперед">▶</button>
    </div>

    <script>
        let pageFlip = null;
        let imageList = [];

        // Проверка существования картинки
        function checkImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Загрузка списка файлов
        async function loadPages() {
            // 1. Пробуем прочитать pages.json
            try {
                const res = await fetch('pages.json?v=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        return data;
                    }
                }
            } catch (e) {}

            // 2. Автопоиск images/1.jpg, images/2.jpg...
            const found = [];
            for (let i = 1; i <= 100; i++) {
                const url = `images/${i}.jpg`;
                const exists = await checkImage(url);
                if (exists) {
                    found.push(url);
                } else {
                    if (found.length > 0) break;
                }
            }
            return found;
        }

        // Инициализация 3D книги
        async function initBook() {
            imageList = await loadPages();

            if (imageList.length === 0) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('loaderText').style.display = 'none';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            const bookElement = document.getElementById('book');

            // Создаем страницы
            imageList.forEach((src) => {
                const page = document.createElement('div');
                page.className = 'page-block';
                const img = document.createElement('img');
                img.src = src;
                page.appendChild(img);
                bookElement.appendChild(page);
            });

            // Настройка пропорций для мобильных и ПК
            const isMobile = window.innerWidth < 768;

            pageFlip = new St.PageFlip(bookElement, {
                width: isMobile ? window.innerWidth * 0.9 : 450,
                height: isMobile ? window.innerHeight * 0.7 : 620,
                size: "stretch",
                minWidth: 280,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1400,
                maxShadowOpacity: 0.5,
                showCover: true, // Первая страница одиночная (обложка)
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page-block'));

            // Событие перелистывания
            pageFlip.on('flip', (e) => {
                updateCounter(e.data);
            });

            // Обновляем счетчик
            updateCounter(0);

            // Показываем книгу
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                bookElement.style.display = 'block';
            }, 500);
        }

        function updateCounter(pageIndex) {
            const total = imageList.length;
            const current = pageIndex + 1;
            document.getElementById('counter').textContent = `${current} / ${total}`;

            document.getElementById('prevBtn').disabled = (current === 1);
            document.getElementById('nextBtn').disabled = (current >= total);
        }

        // Кнопки Назад / Вперед
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (pageFlip) pageFlip.flipPrev();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (pageFlip) pageFlip.flipNext();
        });

        // Клавиатура (стрелки)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
            if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
        });

        // Запуск
        window.addEventListener('DOMContentLoaded', initBook);
    </script>
</body>
</html>
