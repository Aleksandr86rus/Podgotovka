<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Подготовка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100vh; overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 15px 20px; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 1.3rem; color: #e94560; }
        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .controls button {
            background: #e94560; color: #fff; border: none;
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: .95rem; transition: .3s;
        }
        .controls button:hover { background: #c73652; }
        .controls button:disabled { background: #555; cursor: not-allowed; }
        .page-info {
            background: rgba(255,255,255,.1); padding: 8px 15px;
            border-radius: 8px; font-size: .95rem; text-align: center;
        }
        .page-input {
            width: 50px; padding: 6px; border-radius: 6px;
            border: 2px solid #e94560; background: #16213e;
            color: #fff; font-size: .95rem; text-align: center; outline: none;
        }

        .toolbar {
            background: #16213e; padding: 10px 20px; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            flex-wrap: wrap; border-bottom: 1px solid #0f3460;
        }
        .toolbar button {
            background: #0f3460; color: #eee; border: 1px solid #1a4080;
            padding: 7px 12px; border-radius: 6px; cursor: pointer;
            font-size: .85rem; transition: .3s;
        }
        .toolbar button:hover { background: #1a4080; border-color: #e94560; }
        .toolbar button.active { background: #e94560; border-color: #e94560; color: #fff; }
        .zoom-info { color: #e94560; font-weight: 700; min-width: 50px; text-align: center; }

        .app-layout { display: flex; min-height: calc(100vh - 130px); }
        .sidebar {
            width: 160px; background: #16213e; overflow-y: auto;
            max-height: calc(100vh - 130px); padding: 8px;
            display: none; flex-shrink: 0; border-right: 2px solid #0f3460;
        }
        .sidebar.open { display: block; }
        .thumb-item {
            cursor: pointer; margin-bottom: 8px; border: 2px solid transparent;
            border-radius: 6px; overflow: hidden; transition: .3s;
            position: relative; background: #0f3460;
        }
        .thumb-item:hover { border-color: #e94560; }
        .thumb-item.active { border-color: #e94560; box-shadow: 0 0 12px rgba(233,69,96,.4); }
        .thumb-item img { width: 100%; display: block; }
        .thumb-num {
            position: absolute; bottom: 3px; right: 5px;
            background: rgba(0,0,0,.7); color: #fff;
            font-size: .65rem; padding: 1px 5px; border-radius: 3px;
        }
        .main-content {
            flex: 1; overflow-y: auto; max-height: calc(100vh - 130px);
            display: flex; justify-content: center;
            align-items: flex-start; padding: 20px;
        }

        .single-view { display: flex; justify-content: center; width: 100%; }
        .single-view img {
            max-width: 100%; height: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
            border-radius: 4px; transition: transform .3s;
        }
        .book-view { display: flex; justify-content: center; width: 100%; }
        .book-spread { display: flex; position: relative; max-width: 100%; }
        .book-spread::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
            width: 4px; background: linear-gradient(to right,
            rgba(0,0,0,.3),rgba(0,0,0,.1),rgba(0,0,0,.3));
            transform: translateX(-50%); z-index: 10; pointer-events: none;
        }
        .page-left img, .page-right img {
            display: block; max-height: 80vh; max-width: 100%;
        }
        .page-left img { border-radius: 8px 0 0 8px; box-shadow: -8px 8px 30px rgba(0,0,0,.4); }
        .page-right img { border-radius: 0 8px 8px 0; box-shadow: 8px 8px 30px rgba(0,0,0,.4); }
        .page-placeholder {
            background: #2a2a3e; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 1.2rem; width: 250px; height: 400px;
        }
        .scroll-view {
            display: flex; flex-direction: column;
            align-items: center; gap: 15px; padding-bottom: 40px; width: 100%;
        }
        .scroll-view img {
            max-width: 100%; height: auto;
            box-shadow: 0 6px 25px rgba(0,0,0,.4); border-radius: 4px;
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26,26,46,.95); display: flex;
            flex-direction: column; align-items: center;
            justify-content: center; z-index: 1000; transition: opacity .5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #333;
            border-top: 4px solid #e94560; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 1.1rem; color: #e94560; text-align: center; }

        .error-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 80vh; padding: 30px; text-align: center;
        }
        .error-screen h2 { color: #e94560; margin-bottom: 15px; }
        .error-screen button {
            margin-top: 20px; background: #e94560; color: #fff; border: none;
            padding: 12px 30px; border-radius: 8px; font-size: 1rem; cursor: pointer;
        }

        body.night .main-content { background: #111; }
        body.night img { filter: brightness(.75) contrast(1.1); }

        .toast {
            position: fixed; bottom: 70px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #e94560; color: #fff; padding: 10px 25px;
            border-radius: 8px; font-size: .9rem; z-index: 200;
            transition: transform .4s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .fs-btn {
            position: fixed; bottom: 15px; left: 15px;
            background: rgba(233,69,96,.8); color: #fff; border: none;
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; z-index: 50; display: none;
        }

        @media(max-width:768px) {
            .header { padding: 10px; }
            .controls button { padding: 6px 10px; font-size: .8rem; }
            .toolbar { padding: 8px 10px; gap: 5px; }
            .main-content { padding: 10px; }
            .sidebar { width: 110px; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loading-text" id="loadText">Загрузка страниц...</div>
    </div>

    <div id="errScreen" class="error-screen" style="display:none">
        <h2>❌ Страницы не найдены</h2>
        <p>Не удалось загрузить изображения из папки <code>images/</code>.</p>
        <button onclick="location.reload()">🔄 Обновить страницу</button>
    </div>

    <div id="reader" style="display:none">
        <div class="header">
            <h1>📖 <span id="title">Подготовка</span></h1>
            <div class="controls">
                <button id="btnPrev">◀ Назад</button>
                <div class="page-info">
                    <input type="number" class="page-input" id="pgInput" min="1" value="1">
                    / <span id="pgTotal">0</span>
                </div>
                <button id="btnNext">Далее ▶</button>
            </div>
        </div>

        <div class="toolbar">
            <button id="btnZoomOut">🔍−</button>
            <span class="zoom-info" id="zoomVal">100%</span>
            <button id="btnZoomIn">🔍+</button>
            <button id="btnFit">📐 Вписать</button>
            <button id="btnThumbs">🗂 Страницы</button>
            <button id="btnNight">🌙</button>
            <button class="active" data-view="single">📄</button>
            <button data-view="book">📖</button>
            <button data-view="scroll">📜</button>
        </div>

        <div class="app-layout">
            <div class="sidebar" id="sidebar"></div>
            <div class="main-content" id="main"></div>
        </div>
    </div>

    <button class="fs-btn" id="fsBtn">⛶</button>
    <div class="toast" id="toast"></div>

    <script>
        const FOLDER = 'images';
        const EXT = 'jpg';
        const MAX = 500;

        let pages = [];
        let cur = 1;
        let total = 0;
        let zoom = 1;
        let mode = 'single';
        let thumbsDone = false;

        const $ = id => document.getElementById(id);
        const loader = $('loader');
        const loadText = $('loadText');
        const errScreen = $('errScreen');
        const reader = $('reader');
        const main = $('main');
        const sidebar = $('sidebar');
        const pgInput = $('pgInput');
        const pgTotal = $('pgTotal');
        const zoomVal = $('zoomVal');
        const toast = $('toast');
        const viewBtns = document.querySelectorAll('[data-view]');

        function testImg(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        async function findPages() {
            loadText.textContent = 'Поиск страниц...';
            pages = [];
            let fails = 0;

            for (let i = 1; i <= MAX; i++) {
                const url = `${FOLDER}/${i}.${EXT}`;
                const ok = await testImg(url);

                if (ok) {
                    pages.push(url);
                    fails = 0;
                    loadText.textContent = `Найдено страниц: ${pages.length}`;
                } else {
                    fails++;
                    if (fails >= 3 && pages.length > 0) break;
                    if (fails >= 5 && pages.length === 0) break;
                }
            }

            return pages.length > 0;
        }

        async function init() {
            const found = await findPages();

            if (!found) {
                loader.classList.add('hidden');
                errScreen.style.display = 'flex';
                return;
            }

            total = pages.length;
            pgTotal.textContent = total;
            pgInput.max = total;

            loader.classList.add('hidden');
            reader.style.display = 'block';
            $('fsBtn').style.display = 'block';
            render();
        }

        function render() {
            main.innerHTML = '';
            if (mode === 'single') renderSingle();
            else if (mode === 'book') renderBook();
            else renderScroll();
            updateUI();
        }

        function makeImg(idx) {
            const img = document.createElement('img');
            img.src = pages[idx];
            img.alt = 'Стр. ' + (idx + 1);
            return img;
        }

        function renderSingle() {
            const wrap = document.createElement('div');
            wrap.className = 'single-view';
            const img = makeImg(cur - 1);
            img.style.transform = `scale(${zoom})`;
            img.style.transformOrigin = 'top center';
            wrap.appendChild(img);
            main.appendChild(wrap);
        }

        function renderBook() {
            const wrap = document.createElement('div');
            wrap.className = 'book-view';
            const spread = document.createElement('div');
            spread.className = 'book-spread';

            let L, R;
            if (cur === 1) { L = null; R = 1; }
            else {
                L = cur % 2 === 0 ? cur : cur - 1;
                R = L + 1;
                cur = L;
            }

            const ld = document.createElement('div');
            ld.className = 'page-left';
            if (L && L <= total) ld.appendChild(makeImg(L - 1));
            else {
                const p = document.createElement('div');
                p.className = 'page-placeholder'; p.textContent = '📖';
                ld.appendChild(p);
            }
            spread.appendChild(ld);

            const rd = document.createElement('div');
            rd.className = 'page-right';
            if (R && R <= total) rd.appendChild(makeImg(R - 1));
            else {
                const p = document.createElement('div');
                p.className = 'page-placeholder'; p.textContent = '— конец —';
                rd.appendChild(p);
            }
            spread.appendChild(rd);

            wrap.appendChild(spread);
            main.appendChild(wrap);
        }

        function renderScroll() {
            const wrap = document.createElement('div');
            wrap.className = 'scroll-view';
            pages.forEach((_, i) => {
                const img = makeImg(i);
                img.loading = 'lazy';
                wrap.appendChild(img);
            });
            main.appendChild(wrap);
        }

        function buildThumbs() {
            if (thumbsDone) return;
            thumbsDone = true;
            sidebar.innerHTML = '';
            pages.forEach((_, i) => {
                const n = i + 1;
                const d = document.createElement('div');
                d.className = 'thumb-item' + (n === cur ? ' active' : '');
                d.dataset.p = n;
                const img = makeImg(i);
                img.loading = 'lazy';
                d.appendChild(img);
                const lbl = document.createElement('div');
                lbl.className = 'thumb-num'; lbl.textContent = n;
                d.appendChild(lbl);
                d.onclick = () => { cur = n; render(); top(); };
                sidebar.appendChild(d);
            });
        }

        function updateUI() {
            pgInput.value = cur;
            if (mode === 'book') {
                $('btnPrev').disabled = cur <= 1;
                $('btnNext').disabled = cur >= total - 1;
            } else {
                $('btnPrev').disabled = cur <= 1;
                $('btnNext').disabled = cur >= total;
            }
            zoomVal.textContent = Math.round(zoom * 100) + '%';
            document.querySelectorAll('.thumb-item').forEach(t =>
                t.classList.toggle('active', +t.dataset.p === cur));
        }

        function top() { main.scrollTo({ top: 0, behavior: 'smooth' }); }

        $('btnPrev').onclick = () => {
            cur = mode === 'book' ? Math.max(1, cur - 2) : Math.max(1, cur - 1);
            render(); top();
        };
        $('btnNext').onclick = () => {
            cur = mode === 'book' ? Math.min(total, cur + 2) : Math.min(total, cur + 1);
            render(); top();
        };
        pgInput.onchange = () => {
            let v = parseInt(pgInput.value);
            if (isNaN(v) || v < 1) v = 1;
            if (v > total) v = total;
            cur = v; render(); top();
        };

        $('btnZoomIn').onclick = () => { zoom = Math.min(zoom + .2, 3); render(); };
        $('btnZoomOut').onclick = () => { zoom = Math.max(zoom - .2, .4); render(); };
        $('btnFit').onclick = () => { zoom = 1; render(); notify('📐 100%'); };

        $('btnThumbs').onclick = () => {
            sidebar.classList.toggle('open');
            if (sidebar.classList.contains('open')) buildThumbs();
        };

        $('btnNight').onclick = () => {
            document.body.classList.toggle('night');
            const n = document.body.classList.contains('night');
            $('btnNight').textContent = n ? '☀️' : '🌙';
            notify(n ? '🌙 Ночной' : '☀️ Дневной');
        };

        viewBtns.forEach(b => b.onclick = () => {
            viewBtns.forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            mode = b.dataset.view; zoom = 1; render();
        });

        $('fsBtn').onclick = () => {
            if (!document.fullscreenElement)
                document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        };

        document.onkeydown = e => {
            if (!pages.length || document.activeElement === pgInput) return;
            switch (e.key) {
                case 'ArrowLeft': case 'ArrowUp':
                    e.preventDefault(); $('btnPrev').click(); break;
                case 'ArrowRight': case 'ArrowDown': case ' ':
                    e.preventDefault(); $('btnNext').click(); break;
                case '+': case '=':
                    e.preventDefault(); $('btnZoomIn').click(); break;
                case '-':
                    e.preventDefault(); $('btnZoomOut').click(); break;
                case 'Home':
                    e.preventDefault(); cur = 1; render(); top(); break;
                case 'End':
                    e.preventDefault(); cur = total; render(); top(); break;
                case 'f': case 'F':
                    e.preventDefault(); $('fsBtn').click(); break;
                case 'n': case 'N':
                    e.preventDefault(); $('btnNight').click(); break;
            }
        };

        let tx = 0;
        document.ontouchstart = e => { tx = e.changedTouches[0].screenX; };
        document.ontouchend = e => {
            if (!pages.length || mode === 'scroll') return;
            const dx = tx - e.changedTouches[0].screenX;
            if (Math.abs(dx) > 60) dx > 0 ? $('btnNext').click() : $('btnPrev').click();
        };

        function notify(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        init();
    </script>
</body>
      </html>
