<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Книга — Flip Book</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }

    header {
      flex-shrink: 0;
      text-align: center;
      padding: 12px 16px;
      color: #e8e8e8;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
    }

    header h1 {
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    header p {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    #book-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 0;
    }

    .flip-book {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* Страницы книги — изображения на всю страницу */
    .page {
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* или cover — выберите подходящий */
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .page-cover {
      background: linear-gradient(145deg, #2c3e50, #1a252f);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .page-cover h2 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .page-cover p {
      font-size: clamp(0.85rem, 3vw, 1rem);
      opacity: 0.85;
      max-width: 80%;
    }

    /* Панель управления */
    .controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 16px 20px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    .controls button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .controls button:active {
      transform: scale(0.92);
    }

    .controls button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-info {
      color: #e0e0e0;
      font-size: 0.95rem;
      min-width: 90px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* Подсказка */
    .hint {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }

    .hint.visible {
      opacity: 1;
    }
